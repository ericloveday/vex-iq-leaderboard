<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX IQ Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --red: #ce1f07;
    --black: #111111;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--black);
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  .titlebar {
    background: var(--red);
    color: var(--white);
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .titlebar h1 {
    margin: 0;
    font-size: clamp(24px, 3.2vw, 44px);
    font-weight: 900;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .titlebar .subtitle {
    font-size: clamp(14px, 1.4vw, 20px);
    font-weight: 600;
    opacity: 0.92;
  }
  .board {
    flex: 1;
    padding: 30px 40px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    color: var(--white);
  }
  th {
    text-align: left;
    font-size: clamp(13px, 1.1vw, 18px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    padding: 10px 14px;
    border-bottom: 3px solid var(--red);
  }
  td {
    font-size: clamp(16px, 2vw, 28px);
    font-weight: 600;
    padding: 14px 14px;
    border-bottom: 1px solid #2a2a2a;
  }
  tr:nth-child(1) td { font-size: clamp(20px, 2.6vw, 36px); font-weight: 800; }
  tr:nth-child(1) td:first-child, tr:nth-child(1) td:nth-child(2) { color: var(--red); }
  .rank-cell { width: 60px; opacity: 0.85; }
  .num-cell { text-align: center; width: 90px; }
  .empty-state {
    color: #888;
    text-align: center;
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 600;
    padding-top: 60px;
  }
  .footer-note {
    text-align: center;
    color: #555;
    font-size: 13px;
    padding: 10px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="titlebar">
    <h1>VEX IQ Leaderboard</h1>
    <div class="subtitle" id="scopeLabel">Season Standings</div>
  </div>
  <div class="board">
    <table id="board" style="display:none;">
      <thead>
        <tr>
          <th class="rank-cell">#</th>
          <th>Team</th>
          <th class="num-cell">W</th>
          <th class="num-cell">L</th>
          <th class="num-cell">T</th>
          <th class="num-cell">Pts</th>
          <th class="num-cell">Diff</th>
        </tr>
      </thead>
      <tbody id="boardBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState">No matches logged yet — check back after the next event!</div>
  </div>
  <div class="footer-note">Updated live</div>
</div>

<script>
/* ============================================================
   FIREBASE CONFIG — same config as the admin dashboard.
   This widget only reads data (no sign-in), so make sure the
   vexLeaderboard node has public read rules, e.g.:
     "vexLeaderboard": { ".read": true, ".write": "auth != null" }
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBsja7ruNaLkTDTxyga9qd9TZG2Zz5AjHA",
  authDomain: "bathroom-check-out.firebaseapp.com",
  databaseURL: "https://bathroom-check-out-default-rtdb.firebaseio.com",
  projectId: "bathroom-check-out",
  storageBucket: "bathroom-check-out.firebasestorage.app",
  messagingSenderId: "385219454253",
  appId: "1:385219454253:web:970acbfe28672f73c45fa4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT = "vexLeaderboard";

let teams = {};
let matches = {};
let skillsRuns = {};
let events = {};
let settings = {};
const DEFAULT_PLACEMENT_POINTS = [6, 4, 3, 2, 1];

db.ref(`${ROOT}/teams`).on('value', snap => { teams = snap.val() || {}; render(); });
db.ref(`${ROOT}/matches`).on('value', snap => { matches = snap.val() || {}; render(); });
db.ref(`${ROOT}/skillsRuns`).on('value', snap => { skillsRuns = snap.val() || {}; render(); });
db.ref(`${ROOT}/events`).on('value', snap => { events = snap.val() || {}; render(); });
db.ref(`${ROOT}/settings`).on('value', snap => { settings = snap.val() || {}; render(); });

function eventScoringMode(id) {
  return (events[id] && events[id].scoringMode) || 'time';
}
function placementPoints() {
  return (settings.skillsPlacementPoints && settings.skillsPlacementPoints.length)
    ? settings.skillsPlacementPoints
    : DEFAULT_PLACEMENT_POINTS;
}

function computeStandings() {
  const stats = {};
  Object.keys(teams).forEach(id => {
    stats[id] = { id, name: teams[id].name, w: 0, l: 0, t: 0, pf: 0, pa: 0, pts: 0 };
  });

  Object.values(matches).forEach(m => {
    const sides = m.teamAIds && m.teamBIds
      ? [{ teamIds: m.teamAIds, score: m.scoreA }, { teamIds: m.teamBIds, score: m.scoreB }]
      : [{ teamIds: [m.teamAId], score: m.scoreA }, { teamIds: [m.teamBId], score: m.scoreB }];
    const [sideA, sideB] = sides;
    const allIds = [...sideA.teamIds, ...sideB.teamIds];
    if (allIds.some(id => !stats[id])) return;

    sideA.teamIds.forEach(id => { stats[id].pf += sideA.score; stats[id].pa += sideB.score; });
    sideB.teamIds.forEach(id => { stats[id].pf += sideB.score; stats[id].pa += sideA.score; });

    if (sideA.score > sideB.score) {
      sideA.teamIds.forEach(id => { stats[id].w++; stats[id].pts += 2; });
      sideB.teamIds.forEach(id => { stats[id].l++; });
    } else if (sideA.score < sideB.score) {
      sideB.teamIds.forEach(id => { stats[id].w++; stats[id].pts += 2; });
      sideA.teamIds.forEach(id => { stats[id].l++; });
    } else {
      allIds.forEach(id => { stats[id].t++; stats[id].pts += 1; });
    }
  });

  const skillsByEvent = {};
  Object.values(skillsRuns).forEach(r => {
    if (!stats[r.teamId]) return;
    if (!skillsByEvent[r.eventId]) skillsByEvent[r.eventId] = [];
    skillsByEvent[r.eventId].push(r);
  });

  const pointsTable = placementPoints();

  Object.entries(skillsByEvent).forEach(([evId, runsInEvent]) => {
    const mode = eventScoringMode(evId);
    const withBest = runsInEvent
      .map(r => ({ teamId: r.teamId, best: (r.best !== undefined && r.best !== null) ? r.best : r.total }))
      .filter(r => r.best !== undefined && r.best !== null && !isNaN(r.best));

    const ranked = withBest.sort((a, b) => mode === 'time' ? a.best - b.best : b.best - a.best);

    let place = 0, prevBest = null;
    ranked.forEach((r, idx) => {
      if (r.best !== prevBest) { place = idx + 1; prevBest = r.best; }
      const pts = pointsTable[place - 1] || 0;
      stats[r.teamId].pts += pts;
    });
  });

  return Object.values(stats).sort((x, y) => {
    if (y.pts !== x.pts) return y.pts - x.pts;
    const diffX = x.pf - x.pa, diffY = y.pf - y.pa;
    if (diffY !== diffX) return diffY - diffX;
    return y.pf - x.pf;
  });
}

function render() {
  const standings = computeStandings();
  const hasMatches = (Object.keys(matches).length > 0 || Object.keys(skillsRuns).length > 0) && Object.keys(teams).length > 0;

  document.getElementById('board').style.display = hasMatches ? 'table' : 'none';
  document.getElementById('emptyState').style.display = hasMatches ? 'none' : 'block';

  if (!hasMatches) return;

  document.getElementById('boardBody').innerHTML = standings.map((s, i) => `
    <tr>
      <td class="rank-cell">${i + 1}</td>
      <td>${escapeHtml(s.name)}</td>
      <td class="num-cell">${s.w}</td>
      <td class="num-cell">${s.l}</td>
      <td class="num-cell">${s.t}</td>
      <td class="num-cell">${s.pts}</td>
      <td class="num-cell">${s.pf - s.pa > 0 ? '+' : ''}${s.pf - s.pa}</td>
    </tr>
  `).join('');
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
</script>
</body>
</html>
